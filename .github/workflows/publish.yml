name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Pack
        run: npm pack
      - name: Create GitHub Release with the tarball
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" "chatprd-icons-${VERSION}.tgz" \
            --title "@chatprd/icons ${VERSION}" \
            --notes "Install: npm install https://github.com/ChatPRD/chatprd-icons/releases/download/${GITHUB_REF_NAME}/chatprd-icons-${VERSION}.tgz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
