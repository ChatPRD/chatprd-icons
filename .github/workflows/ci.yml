name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Spec checks (palette, gold shield lock, line/spot alignment, tone purity, small tier, tone exports fresh)
        run: npm run check
      - name: Build (codegen + tsc)
        run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Preview page
        run: node scripts/preview.mjs --no-serve
      - uses: actions/upload-artifact@v4
        with:
          name: icon-preview
          path: preview/out/index.html
      - name: Package contents
        run: npm pack --dry-run
